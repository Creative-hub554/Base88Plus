# Anybase CI — gates on every push and PR.
#
# The recovery-arc E2E (tests/fix-pin-publish-e2e.test.ts) runs the REAL
# route handlers against the REAL file store with only the AI provider
# mocked: it spawns scripts/mock-provider.js on a localhost port and chdirs
# into a temp dir. No real provider, no outbound network, no services —
# so it runs on stock ubuntu runners. Port 4611 and the sibling wire-test
# ports stay inside the runner's own namespace.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are pointless — cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Check name shown on PRs: "gates (node 22)" and "gates (node 24)" — mark
  # BOTH required in Settings → Branches → Branch protection → Required
  # status checks after the first run creates them.
  gates:
    name: gates (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Keep going on one leg so a failure on the old LTS tells you whether
      # the change itself is broken (both fail) or it's version drift
      # (only one leg fails) — that's the whole point of the matrix.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Pinned to exact commit SHAs (supply-chain hardening): a compromised
      # tag re-point can't move these. Bump = new immutable SHA + comment.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Reproducible install from package-lock.json (committed).
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Full suite — unit, component, and the wire/E2E tests including
      # the fix → pin → publish recovery arc.
      - name: Tests
        run: npm test
