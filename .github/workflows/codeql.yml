# CodeQL code scanning — the "advanced setup": our own workflow file, so the
# scanner config lives in git next to everything else (no Settings-page
# magic), the actions are pinned to verified commit SHAs like every other
# workflow in this repo, and Dependabot keeps the pins fresh.
#
# What it buys: the Security tab gains a "Code scanning" section alongside
# the Dependabot alerts — static analysis for injection flaws, XSS, path
# traversal, prototype pollution and friends in src/ and scripts/. Alerts
# are produced from analyses of `main`; on PRs CodeQL runs as a check and
# comments new alerts on the diff, but the ruleset gate stays ci-ok-only
# (a new CodeQL alert will not block a merge — triage it in the Security
# tab instead).
#
# javascript-typescript is the merged language id; no build step is needed
# for JS/TS analysis, so there is no autobuild step and no Node setup.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan of main (Mondays 09:23 UTC — off the top-of-hour load
    # spike, matching the house cron style). Scheduled runs pick up new
    # queries in the CodeQL release even with zero pushes.
    - cron: "23 9 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Required to upload the SARIF results that populate the Security tab.
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:javascript-typescript"
