# Release automation — when CI goes green on main, tag the version from
# package.json and publish a GitHub Release with a zip artifact.
#
# Trigger model: `workflow_run` fires when the CI workflow completes. Three
# guards make it correct and idempotent:
#   - `branches: [main]` — PR runs never release (their head_branch differs);
#   - `conclusion == 'success'` at the job level — only green runs proceed
#     (ci-ok already proved every blocking leg passed);
#   - tag-exists check — a re-run or a commit without a version bump no-ops
#     cleanly, so releases are strictly "one tag per package.json version".
#
# `workflow_run` runs in the context of the DEFAULT branch: it checks out
# main (never the PR head), so what it tags, zips, and publishes is exactly
# what the green run gated. GITHUB_TOKEN pushes here do not re-trigger CI
# (pushing an existing tag: ref-unchanged → no event; new tag: no workflow
# matches `on: push: tags` — no loops).
#
# Permissions: read/contents-write, and ONLY the tag/release-producing steps
# touch anything mutable; everything else is read-only analysis.
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    # Never fire on red CI — absorb without noise (idempotent no-op anyway,
    # but skipping avoids a pointless runner bill and a confusing run list).
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Pinned to the same verified SHAs as ci.yml (supply-chain parity).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # workflow_run events check out the default branch's merge ref;
          # pin explicitly to the exact SHA the green run gated. If the push
          # that triggered CI also carried a release.yml change, the ref may
          # not exist yet — fall back to the default-branch ref (the only
          # divergence window is the single commit adding this file).
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # True when HEAD commit == the SHA that just went green. When a
      # workflow-file commit and an app commit land together, head_sha is
      # the head of the push and still matches — the fallback above covers
      # only the first run after this workflow is introduced.
      - name: Confirm the checked-out commit is the one CI gated
        run: |
          echo "head_sha: ${{ github.event.workflow_run.head_sha }}"
          echo "checked out: $(git rev-parse HEAD)"
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::warning::checked-out ref fell back to the default branch; proceeding on that basis"
          fi

      - name: Read the version from package.json
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION from $(git rev-parse HEAD)"

      # Idempotency guard: a commit without a version bump produces the same
      # tag as the previous release → skip silently instead of failing.
      - name: Skip if the tag already exists (no-op release)
        id: tagcheck
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.version }} already tagged — nothing to release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }} (CI green at $(git rev-parse --short HEAD))"
          git push origin "refs/tags/${{ steps.version.outputs.version }}"

      # Source zip via `git archive` (no node_modules, no dev noise). Zip —
      # not tar.gz — because this is a consumer-friendly builder app.
      - name: Build the zip artifact
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          git archive --format=zip --prefix="anybase-${{ steps.version.outputs.version }}/" \
            -o "anybase-${{ steps.version.outputs.version }}.zip" HEAD

      # Publish via the REST API with plain curl — no third-party release
      # action, so this workflow pins exactly the same two actions as CI.
      - name: Create the GitHub Release and upload the artifact
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/releases"
          notes=$(mktemp)
          cat > "$notes" <<EOF
          Automated release of ${VERSION} from CI commit ${{ github.event.workflow_run.head_sha }}.

          - Gates green on main (Node 22/24 matrix + ci-ok)
          - Source zip: \`anybase-${VERSION}.zip\` (generated via git archive)
          - Canonical source: the ${VERSION} tag

          See the [README](https://github.com/${{ github.repository }}#readme) for quick start and CI design.
          EOF
          # JSON built and parsed with plain node — no jq dependency, so the
          # job needs nothing beyond the runner's preinstalled node.
          payload=$(node -e 'const fs=require("fs");process.stdout.write(JSON.stringify({tag_name:process.argv[2],name:process.argv[2],body:fs.readFileSync(process.argv[1],"utf8"),target_commitish:"main"}))' "$notes" "$VERSION")
          resp=$(curl -sS -f -X POST "$api" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$payload")
          release_id=$(echo "$resp" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{process.stdout.write(String(JSON.parse(d).id??""))}catch{process.stdout.write("")}})')
          if [ -z "$release_id" ]; then
            echo "release creation failed:"; echo "$resp"; exit 1
          fi
          curl -sS -f -X POST "$api/$release_id/assets?name=anybase-${VERSION}.zip" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            --data-binary @"anybase-${VERSION}.zip"
          echo "released ${VERSION} (release id $release_id)"
