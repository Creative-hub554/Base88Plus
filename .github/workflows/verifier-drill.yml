# Weekly verifier drill - exercises the Oct 3 / Oct 28 runbook verifiers
# (scripts/verify-oct3.ps1, scripts/verify-oct28.ps1) against FRESH CI data
# every week, so they are debugged long before their real dates.
#
# v2 design notes (v1 fired a CI dispatch from this workflow and 403'd -
# "Resource not accessible by integration": the job GITHUB_TOKEN lacks
# actions:write, and even with it, GITHUB_TOKEN-triggered events never
# create new workflow runs by design). Instead the drill picks the LATEST
# successful CI run on the default branch - every push produces one, so it
# is always fresh data - and smoke-runs BOTH verifiers against it:
#   VERIFY_TOKEN=${{ github.token }}  (read-only Actions/contents reads)
#   VERIFY_FORCE=1 DRY_RUN=1 SMOKE_RUN_ID=<run>   (plumbing only: no date
#   gates, no #18 comments from the verifiers themselves, no closes)
#
# Pass/fail is VERDICT-driven and date-aware, not exit-code-driven:
#   oct3  passes when its verdict is SMOKE_PASS* (UPSTREAM drift between
#         cron refreshes yields ATTENTION_COMMIT_MISSING and a red drill -
#         correct behavior: the snapshot is behind until the next refresh)
#   oct28 passes with SMOKE_FAIL_NOT_PROMOTED before 2026-10-28 (26 is
#         still a canary - the verifier is SUPPOSED to say so) and with
#         SMOKE_PASS* after. A missing/garbage verdict always fails.
name: Verifier drill

on:
  schedule:
    # Mondays 08:23 UTC - off the top-of-hour load spike (same idiom as the
    # monthly CI cron). Scheduled runs execute THIS file on the default
    # branch, so keep the verifiers in scripts/ green on main.
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Existing completed CI run to smoke against (default: latest successful CI run on the default branch)'
        required: false
        default: ''

# One drill at a time; never cancel a running drill mid-verification.
concurrency:
  group: verifier-drill-${{ github.ref }}
  cancel-in-progress: false

# The verifiers only READ the Actions/contents/pull-requests APIs via
# VERIFY_TOKEN; the only write is the failure reminder on issue #18.
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the drill (the verifiers live in scripts/)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the CI run to smoke against (no dispatch - GITHUB_TOKEN cannot trigger runs)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then
            rid="$INPUT_RUN_ID"
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$rid")
            case "$code" in
              200) ;;
              *) echo "CI run $rid not found (http=$code)"; cat /tmp/r.json; exit 1 ;;
            esac
          else
            rid=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // ""')
            if [ -z "$rid" ] || [ "$rid" = "null" ]; then
              echo "No completed success CI run on the default branch to smoke against"; exit 1
            fi
          fi
          echo "ci_run_id=$rid" >> "$GITHUB_OUTPUT"
          echo "Smoking verifiers against CI run $rid"

      - name: Smoke-run verify-oct3.ps1 against the picked CI run
        id: oct3
        continue-on-error: true
        env:
          VERIFY_TOKEN: ${{ github.token }}
          VERIFY_FORCE: '1'
          DRY_RUN: '1'
          SMOKE_RUN_ID: ${{ steps.pick.outputs.ci_run_id }}
        run: pwsh -NoProfile -File scripts/verify-oct3.ps1 > smoke-oct3.log 2>&1; echo "done"

      - name: Smoke-run verify-oct28.ps1 against the picked CI run
        id: oct28
        continue-on-error: true
        env:
          VERIFY_TOKEN: ${{ github.token }}
          VERIFY_FORCE: '1'
          DRY_RUN: '1'
          SMOKE_RUN_ID: ${{ steps.pick.outputs.ci_run_id }}
        run: pwsh -NoProfile -File scripts/verify-oct28.ps1 > smoke-oct28.log 2>&1; echo "done"

      - name: Drill summary (verdict-driven, date-aware)
        id: sum
        run: |
          set -euo pipefail
          v3=$(grep -o 'VERDICT=[A-Z_]*' smoke-oct3.log | tail -1 | cut -d= -f2 || true)
          v28=$(grep -o 'VERDICT=[A-Z_]*' smoke-oct28.log | tail -1 | cut -d= -f2 || true)
          today=$(date -u +%F)
          o3=FAIL; o28=FAIL
          case "$v3" in SMOKE_PASS*) o3=OK ;; esac
          if [ "$today" '<' 2026-10-28 ]; then
            [ "$v28" = "SMOKE_FAIL_NOT_PROMOTED" ] && o28=OK || true
          else
            case "$v28" in SMOKE_PASS*) o28=OK ;; esac
          fi
          echo "oct3_verdict=${v3:-<none>} oct28_verdict=${v28:-<none>} oct3=$o3 oct28=$o28"
          {
            echo "## Weekly verifier drill - $( [ "$o3" = OK ] && [ "$o28" = OK ] && echo PASS || echo FAIL )"
            echo
            echo "- CI run smoked: [${{ steps.pick.outputs.ci_run_id }}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.pick.outputs.ci_run_id }})"
            echo "- verify-oct3.ps1: verdict ${v3:-<none>} -> $o3 (expected: SMOKE_PASS*)"
            echo "- verify-oct28.ps1: verdict ${v28:-<none>} -> $o28 (expected before 2026-10-28: SMOKE_FAIL_NOT_PROMOTED; after: SMOKE_PASS*)"
            echo
            echo "<details><summary>verify-oct3.ps1 output</summary>"
            echo
            echo '```'
            cat smoke-oct3.log
            echo '```'
            echo "</details>"
            echo "<details><summary>verify-oct28.ps1 output</summary>"
            echo
            echo '```'
            cat smoke-oct28.log
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$o3" = OK ] && [ "$o28" = OK ]; then echo "DRILL_PASS"; else echo "DRILL_FAIL"; exit 1; fi

      - name: Reminder nudge on #18 when the drill fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.pick.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          v3=$(grep -o 'VERDICT=[A-Z_]*' smoke-oct3.log 2>/dev/null | tail -1 || echo 'VERDICT=<none>')
          v28=$(grep -o 'VERDICT=[A-Z_]*' smoke-oct28.log 2>/dev/null | tail -1 || echo 'VERDICT=<none>')
          body="Weekly verifier drill FAILED (${{ github.event_name }}, commit ${{ github.sha }}): oct3 ${v3#VERDICT=}, oct28 ${v28#VERDICT=}, CI run inspected ${RUN_ID:-none}. Either a verifier is drifting or its environment is - investigate before the real dates (Oct 3 / Oct 28). Drill run: ${{ github.server_url }}/${GITHUB_REPOSITORY}/actions/runs/${{ github.run_id }}"
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/18/comments" \
            -d "$(jq -n --arg b "$body" '{body:$b}')")
          echo "issue comment http=$code"
          case "$code" in
            200|201) ;;
            *) cat /tmp/c.json; exit 1 ;;
          esac
